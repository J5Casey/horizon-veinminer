[package]
name = "mod-ultimine"
version = "0.4.2"
edition = "2024"
license = "MIT"
description = "Ultimine-style vein mining for Horizon: the trait mod"
publish = false

[lib]
path = "src/lib.rs"

[features]
# Breaking as the player through `Host::player_break_block`
# (horizon-rust/horizon#12259, not merged yet: the bundle pins a Horizon commit
# that has it). Turning it off builds the interim break path in
# src/player_break.rs, for a Horizon without the helper.
default = ["player-break"]
player-break = []

[dependencies]
# The launcher points this at the Horizon source it builds the game from. Any
# other dependency must be a crate and version in Horizon's Cargo.lock.
horizon-client = { git = "https://github.com/horizon-rust/horizon", rev = "bc3dcdd7cf560a11b9d6f4414e7c42cdc79bcfe7" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
