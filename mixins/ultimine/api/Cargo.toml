[package]
name = "mod-ultimine"
version = "0.4.2"
edition = "2024"
license = "MIT"
description = "Ultimine-style vein mining for Horizon: the trait mod"
publish = false

[lib]
path = "src/lib.rs"

[features]
# Breaking as the player through `Host::player_break_block`
# (horizon-rust/horizon#12259) and, for a vein's drops gathered at the origin,
# `Host::player_break_block_kept` and `Host::pop_break_drops` (J5Casey/horizon
# braid/dev12, not upstream yet: the bundle pins a Horizon commit that has
# them). Turning it off builds the interim break path in src/player_break.rs,
# for a Horizon without the helpers.
default = ["player-break"]
player-break = []

[dependencies]
# The launcher points this at the Horizon source it builds the game from. Any
# other dependency must be a crate and version in Horizon's Cargo.lock.
horizon-client = { git = "https://github.com/horizon-rust/horizon", rev = "2044c58ee6d268184095d2bf1a0a7f98c63ca3bf" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
